<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="estilos/estilo.css">
    <link rel="stylesheet" href="estilos/media.css">
    <title>Meu login</title>
</head>
<body>
    <main>
        <section class="imagem"></section>
        <section class="formulario">
            <div class="texto">
                <h1>Login</h1>
                <p>
                    Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.
                </p>
            </div>
            <form action="" method="post">
                <div class="cadastro">
                    <i class="material-symbols-outlined">Person</i>
                    <input type="email" name="email" id="iemail" placeholder="seu e-mail" required>
                </div>
                <div class="cadastro">
                    <i class="material-symbols-outlined">Key</i>
                    <input type="password" name="senha" id="isenha" placeholder="sua senha" minlength="8" required>
                </div>
                <div class="botoes">
                    <input type="submit" value="Entrar">
                    <a href="esquecisenha.html">Esqueci a senha <i class="material-symbols-outlined">Mail</i></a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
